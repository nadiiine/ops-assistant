name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Guardrail tests
        run: python agent/test_guardrails.py -v

      - name: Agent and backend tests
        run: python -m pytest agent/test_agent_namespace.py agent/test_agent_loop.py agent/test_prometheus_query.py agent/test_observability_config.py agent/test_bedrock_smoke.py backend/test_app.py backend/test_observability.py backend/test_topology.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ops-assistant-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t ops-assistant-frontend:ci .
