apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ops-assistant
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: ops-assistant-backend
      automountServiceAccountToken: true
      containers:
        - name: backend
          image: 228281126655.dkr.ecr.us-east-1.amazonaws.com/ops-assistant-dev-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: ops-assistant-config
                  key: LLM_PROVIDER
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: ops-assistant-config
                  key: AWS_REGION
            - name: BEDROCK_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ops-assistant-config
                  key: BEDROCK_MODEL
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: ops-assistant-config
                  key: PROMETHEUS_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
